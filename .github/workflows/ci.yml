# ==============================================================================
# FILE: .github/workflows/ci.yml
# ==============================================================================
#
# SUMMARY
#     Continuous integration: both test suites, the type check, the production
#     build and the Docker image, on every pull request and every push to main.
#     Specified by ci-and-housekeeping (backlog X-8).
#
# BASIC IDEA
#     Publication, local compatibility, internal PostgreSQL 3.12/3.14, actual
#     Compose/browser acceptance, frontend and image checks. Native files run
#     across three isolated runners per OS; coverage manifests guard every case.
#     Four independent performance lanes report through the budgets aggregate.
#     Publication also checks the committed message contract types. The backend runs twice:
#     on Linux with Python 3.12, which is what the Docker image ships, and on
#     Windows local/pure/file compatibility uses Python 3.14. Team DB tests run
#     only inside Linux containers; no CI database host port is published.
#     A pass on one says little about the other -- path separators, line
#     endings and loopback behaviour all differ.
#
#     Timing budgets are separated rather than deleted. A shared runner is a
#     loaded machine, which is exactly where a wall-clock assertion fails
#     without a line of code changing, so the backend's `perf` marker and the
#     frontend's `[budget]` titles run only in `budgets`, which reports and
#     never blocks. There each millisecond limit is multiplied by
#     BUDGET_FACTOR=2 (backend/tests/budget.py, frontend/src/budget.ts), so a
#     runner that is merely slower than a laptop does not turn it red. Count-based budgets (renders, calls, reads) are not timings
#     and stay in the blocking jobs. Locally both suites still run everything.
#
#     `-m` on the command line replaces the `-m "not network"` in pytest.ini
#     rather than adding to it, so every pytest line here names `network`
#     again. Leave it out and the two tests that reach the internet run.
#
# INPUTS / INPUT SOURCES
#     - backend/requirements-dev.txt, frontend/package-lock.json, Dockerfile.
#
# EXPECTED OUTPUT
#     - A red or green check per job on the pull request. Branch protection on
#       main requires backend-linux, backend-windows, frontend and docker; not
#       budgets.
# ==============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request makes the run for the previous one worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts -p 'test_check_publication.py'
      - run: python -m unittest discover -s scripts -p 'test_distribution_notices.py'
      - run: python scripts/generate_message_contracts.py --check
      - name: Check selected Git blobs
        env:
          SCAN_REF: ${{ github.sha }}
        run: python scripts/check_publication.py --git-ref "$SCAN_REF"

  backend-linux-local:
    name: backend-linux-local (Python 3.12, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt -c constraints-distribution.txt
      - name: Verify shard and workflow contracts
        if: ${{ matrix.shard == 1 }}
        working-directory: .
        run: python -m unittest discover -s scripts -p 'test_ci_*.py'
      - name: Linux local, pure logic and file compatibility
        run: >-
          python -m pytest tests -m "not team_db and not perf and not network"
          --ci-shard=${{ matrix.shard }}/3
          --ci-shard-output="${{ runner.temp }}/ci-shards/shard-${{ matrix.shard }}.json"
      - name: Preserve selected case IDs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-native-linux-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-shards/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  backend-windows-local:
    name: backend-windows-local (Python 3.14, shard ${{ matrix.shard }}/3)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt -c constraints-distribution.txt
      - name: Windows native local, pure logic and file compatibility; no native team DB
        run: >-
          python -m pytest tests -m "not team_db and not perf and not network"
          --ci-shard=${{ matrix.shard }}/3
          --ci-shard-output="${{ runner.temp }}/ci-shards/shard-${{ matrix.shard }}.json"
      - name: Preserve selected case IDs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-native-windows-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-shards/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  postgresql:
    name: postgresql (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            tag: py312
          - python: "3.14"
            tag: py314
    env:
      COMPOSE_PROJECT_NAME: ss-pg-${{ matrix.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
      PYTHON_VERSION: ${{ matrix.python }}
      TEAM_DB_SUBNET: 10.253.53.0/24
      TEAM_DB_GATEWAY: 10.253.53.1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Locate private PostgreSQL test fixtures
        run: echo "TEAM_TEST_SECRETS_DIR=$RUNNER_TEMP/pg-test-secrets" >> "$GITHUB_ENV"
      - name: Generate private synthetic role files
        run: python backend/tests/pg_support.py --init-secrets "$TEAM_TEST_SECRETS_DIR"
      - run: docker compose -f docker-compose.postgresql-test.yml build pg-tests
      - name: Real PostgreSQL tests inside the dedicated internal network
        run: docker compose -f docker-compose.postgresql-test.yml run --rm pg-tests python -m pytest tests -m "team_db and not perf and not network" -q -o cache_dir=/tmp/pytest-cache
      - name: Stop this project while preserving its volumes
        if: ${{ always() }}
        run: docker compose -f docker-compose.postgresql-test.yml down --remove-orphans

  compose-team:
    name: compose-team-network-recovery-browser
    runs-on: ubuntu-latest
    env:
      SEMANTIC_STUDIO_COMPOSE_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt -c backend/constraints-distribution.txt
      - name: Locate the Python used by the host browser driver
        run: echo "SEMANTIC_STUDIO_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - run: npm ci --no-fund --no-audit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: docker build -t semantic-studio:team .
      - name: Actual network, ownership, changed DNS and two-project restore
        run: python -m unittest scripts.test_pg_compose_network scripts.test_pg_compose_lifecycle scripts.test_release_compose
      - run: node .claude/skills/run-semantic-viewer/driver.mjs smoke
      - run: node .claude/skills/run-semantic-viewer/driver.mjs master-import
      - run: node .claude/skills/run-semantic-viewer/driver.mjs p1
        env:
          BUDGET_REPORT_ONLY: "1"
      - name: Real HTTPS, signed identities and two browser contexts against PostgreSQL
        run: node .claude/skills/run-semantic-viewer/driver.mjs p3

  # Preserve the existing branch-protection check names. These gates cannot
  # succeed unless every newly named coverage job above has actually passed.
  backend-linux:
    needs: [backend-linux-local, postgresql, compose-team]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c 'import json,os; assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values())'
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: ci-native-linux-*
          path: ${{ runner.temp }}/ci-shards
          merge-multiple: true
      - name: Verify complete native case coverage
        run: python backend/tests/ci_sharding.py --directory "${{ runner.temp }}/ci-shards" --total 3

  backend-windows:
    needs: [backend-windows-local]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c 'import json,os; assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values())'
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: ci-native-windows-*
          path: ${{ runner.temp }}/ci-shards
          merge-multiple: true
      - name: Verify complete native case coverage
        run: python backend/tests/ci_sharding.py --directory "${{ runner.temp }}/ci-shards" --total 3

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Temporary data folder
        shell: bash
        run: echo "SEMANTIC_STUDIO_DATA_DIR=${{ runner.temp }}/semantic-studio-data" >> "$GITHUB_ENV"
      - run: npm ci --no-fund --no-audit
      # Everything but the tests titled [budget]; see test:ci in package.json.
      - run: node build/distributionNotices.check.mjs
      - run: npm run test:ci
      # `npm run build` is these two steps; split so a failure names which.
      - run: npx tsc -b
      - run: npx vite build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Temporary data folder
        shell: bash
        run: echo "SEMANTIC_STUDIO_DATA_DIR=${{ runner.temp }}/semantic-studio-data" >> "$GITHUB_ENV"
      # Built to prove the image builds; never pushed anywhere.
      - run: docker build .

  # Dedicated runners keep measurements from competing with each other.
  # Each lane reports its real outcome; the aggregate stays informational.
  budgets-native:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
    env:
      BUDGET_FACTOR: "2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Temporary data folder
        run: echo "SEMANTIC_STUDIO_DATA_DIR=$RUNNER_TEMP/semantic-studio-data" >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - name: Backend perf budgets
        run: python -m pytest tests -m "perf and not team_db and not network"
        working-directory: backend
      - name: Record measurement result even after a failed setup or cleanup
        id: result
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "outcome=$JOB_STATUS" >> "$GITHUB_OUTPUT"

  budgets-frontend:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
    env:
      BUDGET_FACTOR: "2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Temporary data folder
        run: echo "SEMANTIC_STUDIO_DATA_DIR=$RUNNER_TEMP/semantic-studio-data" >> "$GITHUB_ENV"
      - run: npm ci --no-fund --no-audit
        working-directory: frontend
      - name: Frontend timing budgets
        run: npm run test:budgets
        working-directory: frontend
      - name: Record measurement result even after a failed setup or cleanup
        id: result
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "outcome=$JOB_STATUS" >> "$GITHUB_OUTPUT"

  budgets-browser:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
    env:
      BUDGET_FACTOR: "2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Temporary data folder
        run: echo "SEMANTIC_STUDIO_DATA_DIR=$RUNNER_TEMP/semantic-studio-data" >> "$GITHUB_ENV"
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Locate the browser budget Python
        run: echo "SEMANTIC_STUDIO_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - run: npm ci --no-fund --no-audit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: P1 real browser timing budget
        run: node .claude/skills/run-semantic-viewer/driver.mjs p1
      - name: Record measurement result even after a failed setup or cleanup
        id: result
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "outcome=$JOB_STATUS" >> "$GITHUB_OUTPUT"

  budgets-postgresql:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
    env:
      BUDGET_FACTOR: "2"
      COMPOSE_PROJECT_NAME: ss-pg-budgets-${{ github.run_id }}-${{ github.run_attempt }}
      PYTHON_VERSION: "3.12"
      TEAM_DB_SUBNET: 10.253.53.0/24
      TEAM_DB_GATEWAY: 10.253.53.1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Locate private PostgreSQL budget fixtures
        run: echo "TEAM_TEST_SECRETS_DIR=$RUNNER_TEMP/pg-budget-secrets" >> "$GITHUB_ENV"
      - name: Generate private PostgreSQL budget fixtures
        run: python backend/tests/pg_support.py --init-secrets "$TEAM_TEST_SECRETS_DIR"
      - name: Build the internal PostgreSQL budget runner
        run: docker compose -f docker-compose.postgresql-test.yml build pg-tests
      - name: All backend budgets in the PostgreSQL runner
        run: docker compose -f docker-compose.postgresql-test.yml run --rm pg-tests python -m pytest tests -m "perf and not network" -q -o cache_dir=/tmp/pytest-cache
      - name: Stop budget fixtures while retaining volumes
        if: ${{ always() }}
        run: docker compose -f docker-compose.postgresql-test.yml down --remove-orphans
      - name: Record measurement result even after a failed setup or cleanup
        id: result
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "outcome=$JOB_STATUS" >> "$GITHUB_OUTPUT"

  budgets:
    needs: [budgets-native, budgets-frontend, budgets-browser, budgets-postgresql]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Report every independent measurement lane
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c 'import json,os; assert all(job["result"] == "success" and job["outputs"].get("outcome") == "success" for job in json.loads(os.environ["RESULTS"]).values())'
