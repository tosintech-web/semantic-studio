# ==============================================================================
# FILE: docker-compose.postgresql-test.yml
# SUMMARY
#     Disposable internal-only PostgreSQL integration tests, never a host DB port.
# BASIC IDEA
#     Generate HBA without network/secrets; initialize fixed roles on peer socket.
# INPUTS / INPUT SOURCES
#     Explicit project name and private synthetic secret files from pg_support.
# EXPECTED OUTPUT
#     Real PostgreSQL and a runner attached only to this project's IPv4 bridge.
# ==============================================================================
x-db-environment: &db-environment
  SEMANTIC_STUDIO_DB_HOST: db
  SEMANTIC_STUDIO_DB_PORT: "5432"
  SEMANTIC_STUDIO_DB_NAME: semantic_studio_team
  SEMANTIC_STUDIO_DB_SUBNET: ${TEAM_DB_SUBNET:-172.30.53.0/24}
  SEMANTIC_STUDIO_DB_GATEWAY: ${TEAM_DB_GATEWAY:-172.30.53.1}
x-test-image: &test-image
  image: semantic-studio-pg-tests:${PYTHON_VERSION:-3.12}
  build:
    context: .
    dockerfile: Dockerfile.postgresql-test
    args:
      PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
services:
  db-config:
    <<: *test-image
    network_mode: none
    environment: *db-environment
    command: [python, -m, app.team.pg_bootstrap, /db-config]
    volumes:
      - hba_config:/db-config
  db:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    depends_on:
      db-config:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: semantic_studio_team
      POSTGRES_PASSWORD_FILE: /run/secrets/team_db_admin
      POSTGRES_INITDB_ARGS: --auth-local=peer --auth-host=scram-sha-256
    command: [postgres, -c, hba_file=/db-config/pg_hba.conf, -c, listen_addresses=*, -c, password_encryption=scram-sha-256, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_error_verbosity=terse, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0]
    networks: [db_internal]
    secrets: [team_db_admin, team_db_app, team_db_maintenance, team_db_backup]
    volumes:
      - postgres_data:/var/lib/postgresql
      - hba_config:/db-config:ro
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
      - ./docker/postgres/init-roles.sql:/opt/team-init-roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h /var/run/postgresql -U postgres -d semantic_studio_team"]
      interval: 1s
      timeout: 5s
      retries: 30
  pg-tests:
    <<: *test-image
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-environment
      SEMANTIC_STUDIO_DB_USER: team_app
      SEMANTIC_STUDIO_DB_PASSWORD_FILE: /run/secrets/team_db_app
      BUDGET_FACTOR: ${BUDGET_FACTOR:-1}
    networks: [db_internal]
    secrets: [team_db_app, team_db_maintenance, team_db_backup]
    volumes:
      - ./backend:/workspace/backend:ro
networks:
  db_internal:
    driver: bridge
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${TEAM_DB_SUBNET:-172.30.53.0/24}
          gateway: ${TEAM_DB_GATEWAY:-172.30.53.1}
volumes:
  postgres_data:
  hba_config:
secrets:
  team_db_admin:
    file: ${TEAM_TEST_SECRETS_DIR:-.superpowers/sdd/2026-10-27-p2-postgresql/secrets}/admin
  team_db_app:
    file: ${TEAM_TEST_SECRETS_DIR:-.superpowers/sdd/2026-10-27-p2-postgresql/secrets}/app
  team_db_maintenance:
    file: ${TEAM_TEST_SECRETS_DIR:-.superpowers/sdd/2026-10-27-p2-postgresql/secrets}/maintenance
  team_db_backup:
    file: ${TEAM_TEST_SECRETS_DIR:-.superpowers/sdd/2026-10-27-p2-postgresql/secrets}/backup
