# ==============================================================================
# FILE: docker-compose.team.yml
# SUMMARY
#     Single-process team application with a dedicated private PostgreSQL service.
# BASIC IDEA
#     Generate shared HBA/IPAM configuration, initialize isolated roles, migrate
#     before app startup, and expose only loopback application HTTP to the proxy.
# INPUTS / INPUT SOURCES
#     File-backed role secrets, explicit team settings and nonoverlapping IPAM.
# EXPECTED OUTPUT
#     Durable PostgreSQL/blobs, internal-only DB access and role-specific jobs.
# ==============================================================================
x-app-image: &app-image
  build: .
  image: semantic-studio:team
x-db-environment: &db-environment
  SEMANTIC_STUDIO_DB_HOST: db
  SEMANTIC_STUDIO_DB_PORT: "5432"
  SEMANTIC_STUDIO_DB_NAME: semantic_studio_team
  SEMANTIC_STUDIO_DB_SUBNET: ${TEAM_DB_SUBNET:-172.30.53.0/24}
  SEMANTIC_STUDIO_DB_GATEWAY: ${TEAM_DB_GATEWAY:-172.30.53.1}
x-maintenance-environment: &maintenance-environment
  <<: *db-environment
  SEMANTIC_STUDIO_DB_USER: team_maintenance
  SEMANTIC_STUDIO_DB_PASSWORD_FILE: /run/secrets/team_db_maintenance
x-maintenance: &maintenance
  <<: *app-image
  profiles: [maintenance]
  networks: [db_internal]
  environment: *maintenance-environment
  secrets: [team_db_maintenance]
services:
  db-config:
    <<: *app-image
    network_mode: none
    environment: *db-environment
    command: [python, -m, app.team.pg_bootstrap, /db-config]
    volumes: [hba_config:/db-config]
  db:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    depends_on:
      db-config:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: semantic_studio_team
      POSTGRES_PASSWORD_FILE: /run/secrets/team_db_admin
      POSTGRES_INITDB_ARGS: --auth-local=peer --auth-host=scram-sha-256
    command: [postgres, -c, hba_file=/db-config/pg_hba.conf, -c, listen_addresses=*, -c, password_encryption=scram-sha-256, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_error_verbosity=terse, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0]
    networks: [db_internal]
    secrets: [team_db_admin, team_db_app, team_db_maintenance, team_db_backup]
    volumes:
      - postgres_data:/var/lib/postgresql
      - hba_config:/db-config:ro
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
      - ./docker/postgres/init-roles.sql:/opt/team-init-roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'test "$$(cat /proc/1/comm)" = postgres && pg_isready -h /var/run/postgresql -U postgres -d semantic_studio_team']
      interval: 1s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  db-migrate:
    <<: *app-image
    networks: [db_internal]
    environment: *maintenance-environment
    secrets: [team_db_maintenance]
    command: [python, -m, app.team.manage, init-schema]
    depends_on:
      db:
        condition: service_healthy
  semantic-studio-team:
    <<: *app-image
    ports: ["127.0.0.1:${TEAM_APP_PORT:-8000}:8000"]
    networks: [app_net, db_internal]
    environment:
      <<: *db-environment
      SEMANTIC_STUDIO_DB_USER: team_app
      SEMANTIC_STUDIO_DB_PASSWORD_FILE: /run/secrets/team_db_app
      SEMANTIC_STUDIO_MODE: team
      SEMANTIC_STUDIO_DATA_DIR: /data
      # Empty settings fail closed in TeamConfig. Interpolation does not require
      # Google/app credentials merely to run a role-only maintenance job.
      SEMANTIC_STUDIO_PUBLIC_ORIGIN: ${SEMANTIC_STUDIO_PUBLIC_ORIGIN:-}
      SEMANTIC_STUDIO_GOOGLE_CLIENT_ID: ${SEMANTIC_STUDIO_GOOGLE_CLIENT_ID:-}
      SEMANTIC_STUDIO_GOOGLE_CLIENT_SECRET: ${SEMANTIC_STUDIO_GOOGLE_CLIENT_SECRET:-}
      SEMANTIC_STUDIO_ALLOWED_DOMAINS: ${SEMANTIC_STUDIO_ALLOWED_DOMAINS:-}
      SEMANTIC_STUDIO_BOOTSTRAP_SUBS: ${SEMANTIC_STUDIO_BOOTSTRAP_SUBS:-}
    secrets: [team_db_app]
    command: [python, -m, app.team.server]
    volumes: [team_data:/data]
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  migrate:
    <<: *maintenance
    command: [python, -m, app.team.manage, migrate, --source, /source, --destination, /data, --dry-run]
    volumes:
      - team_data:/data
      - ${TEAM_LOCAL_SOURCE_DIR:-./team-local-source}:/source:ro
  backup:
    <<: *app-image
    profiles: [maintenance]
    networks: [db_internal]
    environment:
      <<: *db-environment
      SEMANTIC_STUDIO_DB_USER: team_backup
      SEMANTIC_STUDIO_DB_PASSWORD_FILE: /run/secrets/team_db_backup
    secrets: [team_db_backup]
    command: [python, -m, app.team.manage, backup, --blob-root, /data/blobs, --destination, /backups/generation]
    volumes: [team_data:/data:ro, team_backups:/backups]
  restore:
    <<: *maintenance
    command: [python, -m, app.team.manage, restore, --archive, /backups/generation, --destination, /data]
    volumes: [team_data:/data, team_backups:/backups:ro]
networks:
  app_net:
    driver: bridge
  db_internal:
    driver: bridge
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${TEAM_DB_SUBNET:-172.30.53.0/24}
          gateway: ${TEAM_DB_GATEWAY:-172.30.53.1}
volumes:
  postgres_data:
  hba_config:
  team_data:
  team_backups:
secrets:
  team_db_admin:
    file: ${TEAM_DB_ADMIN_SECRET_FILE:-./secrets/team-admin}
  team_db_app:
    file: ${TEAM_DB_APP_SECRET_FILE:-./secrets/team-app}
  team_db_maintenance:
    file: ${TEAM_DB_MAINTENANCE_SECRET_FILE:-./secrets/team-maintenance}
  team_db_backup:
    file: ${TEAM_DB_BACKUP_SECRET_FILE:-./secrets/team-backup}
